[project]
name = "hone"
version = "0.1.0"
description = "Autonomous Bitbucket PR reviewer — an agent-building experiment"
readme = "README.md"
license = "MIT"
authors = [{ name = "Richard Hibbitts" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.141.1",
    "httpx>=0.28",
    "python-dotenv>=1.1",
    "uvicorn>=0.53.0",
]

[project.scripts]
hone = "hone.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
